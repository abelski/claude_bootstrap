# Dependency vulnerability scan.
#
# Deliberately NOT part of ci.yml. A new advisory is published by a third party, at a time
# unrelated to your pushes: making it fail the push gate would turn an unrelated commit red and
# train everyone to ignore the pipeline. This runs weekly on its own, so a red run means exactly
# one thing — a new advisory affects a pinned dependency.
#
# To reproduce locally:
#   uv export --frozen --no-dev --no-emit-project -o /tmp/req.txt
#   uvx pip-audit -r /tmp/req.txt
name: Dependency audit

on:
  schedule:
    # Off the hour on purpose — scheduled jobs on the hour queue behind everyone else's cron on
    # shared runners.
    - cron: "17 6 * * 1"
  workflow_dispatch:
  # Also on any change to the lock file itself, so a dependency bump is audited by the same
  # commit that makes it rather than up to a week later.
  push:
    paths:
      - uv.lock
      - pyproject.toml
      - .github/workflows/audit.yml

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Runtime dependencies only: --no-dev drops test tooling, which never ships in the image.
      # --no-emit-project drops this project itself. Hashes are kept.
      - name: Export the locked runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project -o requirements-audit.txt

      - name: pip-audit
        run: uvx pip-audit -r requirements-audit.txt --progress-spinner off
