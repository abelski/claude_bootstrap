# Lint + test gate. Runs on every push, costs nothing, and needs no secrets.
#
# Deliberately **secret-free**: skip any test that needs a live API key or hits a real external
# service — run those locally on purpose, not in CI. Rename the job/steps to match your project's
# actual lint/type-check tools if they differ from ruff/ty.
name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# A branch only ever needs its newest commit checked; superseded runs are cancelled so a burst of
# pushes cannot eat the free-tier minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install 3.12

      # --frozen refuses to update uv.lock, so a pyproject.toml edited without re-locking fails
      # here instead of drifting until someone notices.
      - name: Install dependencies
        run: uv sync --frozen --dev --extra lint

      # Each gate is a separate step so a red run says which one failed without reading the log.
      - name: ruff
        run: uv run --no-sync ruff check .

      - name: codespell
        run: uv run --no-sync codespell

      - name: type check
        run: uv run --no-sync ty check

      - name: pytest
        run: uv run --no-sync pytest tests/unit -q
